name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu is pinned so a move of ubuntu-latest to a new release cannot change the toolchain by surprise.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Icarus Verilog (Ubuntu), so the equivalence checks run
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install Icarus Verilog (macOS), so the equivalence checks run
        if: runner.os == 'macOS'
        run: brew install icarus-verilog

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit, golden and accuracy tests (built-in wasm engine)
        run: npx vitest run
        env:
          RTL_LIVE_TEST_BACKEND: wasm

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Webview tests
        run: npx playwright test

      - name: Integration tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx vscode-test

      - name: Integration tests
        if: runner.os != 'Linux'
        run: npx vscode-test

      - name: Install Yosys (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y yosys

      - name: Unit, golden and accuracy tests (native Yosys, Ubuntu)
        if: runner.os == 'Linux'
        run: npx vitest run
        env:
          RTL_LIVE_TEST_BACKEND: native

      - name: Package
        run: npm run package

      - name: Upload vsix
        uses: actions/upload-artifact@v7
        with:
          name: rtl-live-${{ matrix.os }}
          path: "*.vsix"
          if-no-files-found: error

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            artifacts/
            .vscode-test/user-data/logs/
          if-no-files-found: ignore
